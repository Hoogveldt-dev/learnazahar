name: citra-format

on:
  # WooferAzahar: upstream Azahar workflow, only started by hand. A push to this
  # private repository would otherwise run every platform build on paid runners.
  # The Woofer checks run in woofer.yml.
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ./.ci/clang-format.sh

  ktlint:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: ./tools/check-kotlin-formatting.sh