name: citra-license

on:
  # WooferAzahar: upstream Azahar workflow, only started by hand. A push to this
  # private repository would otherwise run every platform build on paid runners.
  # The Woofer checks run in woofer.yml.
  workflow_dispatch:

jobs:
  license-header:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch master branch
        run: git fetch origin master:master
      - name: Check license headers
        run: ./.ci/license-header.rb
