name: citra-transifex

on:
  # WooferAzahar: upstream Azahar workflow, only started by hand. A push to this
  # private repository would otherwise run every platform build on paid runners.
  # The Woofer checks run in woofer.yml.
  workflow_dispatch:

jobs:
  transifex:
    runs-on: ubuntu-latest
    container: opensauce04/azahar-build-environment:latest
    if: ${{ github.repository == 'azahar-emu/azahar' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update Translation
        run: ./.ci/transifex.sh
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
